name: Secret scanning

# Backstops codeql.yml's code-level static analysis with a dedicated
# secret-scanning gate (issue #306) — this repository's review process is
# single-maintainer self-review by design (SECURITY.md's "Maintainer
# structure"), so a mechanical gate matters more here than it would under
# independent peer review.
#
# Runs the gitleaks CLI binary directly rather than the gitleaks/gitleaks-action
# wrapper: that wrapper hard-fails without a paid GITLEAKS_LICENSE secret for
# any repository owned by a GitHub Organization (gitleaks/gitleaks-action's
# own src/index.js), which Poetic-Poems is. The gitleaks CLI itself is
# MIT-licensed and free regardless of account type — only the wrapper's
# PR-comment convenience feature is license-gated — so this installs the
# published release binary (checksum-verified) and calls it directly.
#
# fetch-depth: 0 scans the full commit history, not just the working tree,
# so a secret committed and later removed still fails the job.
#
# Same trigger shape as codeql.yml: `pull_request` (not `pull_request_target`)
# so a fork PR never runs with write-scoped secrets, plus `push` to main for a
# baseline and `merge_group` so this reports on the queue too.
#
# This job is not added to the `default` ruleset's required status checks as
# part of this change — see AGENTS.md's "Branch protection in this
# repository" on required-checks.txt being an owner-maintained record; opting
# a new check in is an owner call, not something this pull request makes for
# them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLOf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLOf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v
