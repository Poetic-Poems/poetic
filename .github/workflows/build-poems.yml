name: Build and Deploy Poems to GitHub Pages

# The `build` job below is a required status check, so this workflow must
# trigger on every push/PR to main regardless of what changed — a `paths:`
# filter on the trigger itself would make the check silently disappear
# (stuck as "Expected" forever, blocking merge) for a PR that only touches
# paths outside the filter, e.g. a doc-only PR editing CLAUDE.md or
# SECURITY.md. See GitHub's "Choose when workflows run" guide:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
#
# Instead, the `build` job always triggers and always reports a real "build"
# status, but its actual steps (install/test/lint/build/deploy) are skipped
# via the "Check whether build-relevant paths changed" step below whenever
# every changed file is inert. That list exists exactly once, here, purely to
# decide whether to skip — there is no second, separately-triggered workflow
# with its own inverse path list to keep in sync by hand.
#
# The list names what is *inert*, not what is relevant, and anything it does
# not name runs the build. This direction is deliberate: because a pass here
# is what unblocks a merge, the failure mode of an allow-list — a path nobody
# remembered to add, silently skipping lint/test/build forever — is a hole in
# the gate rather than a wasted runner minute. With the list inverted, adding
# a source directory is safe by default and only an explicit claim that a
# path cannot affect the build can ever skip it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Workflow-level concurrency is keyed per ref, so an unrelated run — a
# different pull request, a push to `main` while a PR is building, an
# unrelated merge-group attempt — never cancels this one; only a newer run on
# the *same* ref supersedes an older one, e.g. a PR gaining a follow-up
# commit. Each merge-group attempt already gets its own unique
# `gh-readonly-queue/...` ref, so this alone gives `build` — a required
# status check on the merge queue's candidate ref — the same guarantee the
# previous merge-group-only carve-out gave it: a run of this workflow started
# by any unrelated push or pull request cannot cancel it, since a cancelled
# conclusion is not a pass and the queue would drop the queued pull request
# rather than merge it.
#
# `refs/heads/main` is the one ref where cancelling would mean killing an
# in-progress deploy: two pushes to `main` in quick succession share the same
# per-ref group, so `cancel-in-progress: true` there would cancel the first
# push's run — including a `deploy` already underway — the moment the second
# starts (GitHub's own Pages starter workflow disables cancellation for this
# reason). Cancellation is therefore disabled specifically for `main`; runs
# there queue instead of cancelling. The job-level lock on `deploy` below is
# what then guarantees only one deployment executes at a time even when some
# other ref races it in (e.g. a `workflow_dispatch` run on a non-`main` ref,
# which `deploy`'s own `if:` also allows to deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.precheck.outputs.pages }}
      relevant: ${{ steps.changes.outputs.relevant }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether build-relevant paths changed
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # merge_group has no pull_request payload — the merge group's own
            # base/head shas play the same role.
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
          else
            # workflow_dispatch (or any other event): no meaningful diff to
            # compute, so always run the real build.
            base=""
            head=""
          fi

          # The diff below is three-dot (merge-base..head), not two-dot: `base`
          # is the base branch's tip at event time, so on a branch that is
          # behind main a two-dot diff also reports files main changed and this
          # branch did not. That only ever over-reports — a wasted build, never
          # a missed one — but three-dot asks the question actually meant here:
          # what did *this branch* change? `fetch-depth: 0` above is what makes
          # the merge base available to compute.
          relevant=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            relevant=false
            while IFS= read -r file; do
              case "$file" in
                # Prose and repository metadata: no build step, test, or lint
                # rule reads any of these, so a change confined to them cannot
                # alter the built site. Everything else falls through to the
                # default below and runs the build.
                *.md|docs/*|*.ebnf|LICENCE|LICENSE|.gitignore|.gitattributes)
                  ;;
                *)
                  relevant=true
                  ;;
              esac
            done < <(git diff --name-only "$base...$head")
          fi

          echo "Build-relevant paths changed: $relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - name: Check if this is a user repo
        id: precheck
        run: |
          if [ -f .poetic-version ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "No .poetic-version — build will run but Pages deployment is skipped (this is the poetic framework repo)."
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      # Ensure a full vim (with +syntax) is present so test/vim-syntax.test.js
      # actually runs instead of self-skipping.
      - name: Install vim
        if: steps.changes.outputs.relevant == 'true'
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: Run tests
        if: steps.changes.outputs.relevant == 'true'
        run: npm test

      - name: Check coverage thresholds
        if: steps.changes.outputs.relevant == 'true'
        run: npm run coverage

      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint

      - name: Check dependency licences
        if: steps.changes.outputs.relevant == 'true'
        run: npm run check:licenses

      - name: Check for trailing whitespace
        if: steps.changes.outputs.relevant == 'true'
        run: npm run check

      - name: Build poems
        if: steps.changes.outputs.relevant == 'true'
        run: npm run build

      - name: Check for build artifacts
        if: steps.changes.outputs.relevant == 'true'
        run: npm run check:build

      # Non-blocking: surfaces axe-core findings (missing landmarks, contrast
      # failures, etc.) against index.html and one poem page without gating
      # the merge — see TD26072616. Drives the Chrome already installed on
      # this runner image rather than downloading a bundled browser.
      - name: Accessibility check (non-blocking)
        if: steps.changes.outputs.relevant == 'true'
        continue-on-error: true
        run: npm run a11y

      - name: Setup Pages
        if: steps.changes.outputs.relevant == 'true' && steps.precheck.outputs.pages == 'true'
        uses: actions/configure-pages@v6

      - name: Prepare deployment structure
        if: steps.changes.outputs.relevant == 'true' && steps.precheck.outputs.pages == 'true'
        run: |
          # Create a deployment directory structure
          mkdir -p deployment/public
          # Copy all public files to the deployment/public directory
          cp -r public/* deployment/public/
          # Copy essential files to root for direct access
          cp public/index.html deployment/
          cp public/all-poems.html deployment/
          cp public/poetic.css deployment/
          cp public/poetic.js deployment/
          cp public/date-utils.js deployment/
          cp public/all-poems.js deployment/
          cp public/index.js deployment/
          [ -f public/custom.css ] && cp public/custom.css deployment/
          # Copy image assets to root so favicon hrefs resolve from root-level HTML files
          find public -maxdepth 1 -type f \( -name "*.svg" -o -name "*.png" -o -name "*.ico" -o -name "*.webp" \) -exec cp {} deployment/ \;
          # Copy all individual poem HTML redirect stubs to root for GitHub Pages access
          find public -maxdepth 1 -name "*.html" -type f -exec cp {} deployment/ \;
          # Copy per-poem directories so clean URLs (/bounce/) resolve
          find public -mindepth 1 -maxdepth 1 -type d ! -name raw -exec cp -r {} deployment/ \;
          # Raw poem file access
          mkdir -p deployment/public/raw
          cp public/raw/index.html deployment/public/raw/index.html
          # Display results
          echo "Deployment structure created:"
          if $(type tree >/dev/null 2>&1); then
            tree -s deployment
          else
            find deployment -type f -ls
          fi | head -500

      - name: Upload artifact
        id: upload
        if: steps.changes.outputs.relevant == 'true' && steps.precheck.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./deployment"

      - name: Verify artifact upload
        if: steps.changes.outputs.relevant == 'true' && steps.precheck.outputs.pages == 'true'
        run: |
          echo "✅ Artifact uploaded successfully"
          echo "Deployment structure verification:"
          echo "Root files:"
          ls -la deployment/
          echo "Public directory files:"
          ls -la deployment/public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && needs.build.outputs.pages == 'true' && needs.build.outputs.relevant == 'true'
    # Serialises actual deployments globally, independent of the workflow-level
    # per-ref group above: a `workflow_dispatch` run on some other ref can also
    # reach `deploy` (see the `if:` above), so the per-ref group alone would not
    # stop it racing a `main` push's deploy. `cancel-in-progress: false` queues
    # a second deploy behind the first rather than cancelling it mid-flight.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    # Longer than the other light jobs: this job's single step polls the Pages
    # service for up to 10 minutes (actions/deploy-pages' own `timeout` input
    # defaults to 600000 ms), so a shorter job timeout would kill a slow but
    # ultimately successful deployment, and would pre-empt the action's own
    # timeout error.
    timeout-minutes: 12
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
