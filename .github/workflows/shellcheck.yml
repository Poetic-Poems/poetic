name: Shellcheck

# Several scripts under scripts/ already carry `# shellcheck source=`/
# `# shellcheck disable=` directive comments, implying the author runs
# shellcheck locally or in-editor, but nothing enforced that for anyone else
# touching these scripts (issue #304). This job runs the same check in CI.
#
# Scope is exactly `scripts/*.sh` and `.githooks/*` — the shell scripts this
# repository owns, including `.githooks/commit-msg` and
# `.githooks/post-checkout`, which are shell scripts by shebang despite
# having no `.sh` suffix. `-x` follows local `source`d files (e.g.
# assemble-changelog.sh's `lib/changelog-grammar.sh`) so sourcing one script
# from another doesn't spuriously warn.
#
# Deliberately not a required status check (see AGENTS.md's "Branch
# protection in this repository" — the ruleset is an owner-only edit);
# landing this job non-required first lets the owner decide separately
# whether to require it. Same trigger shape as the other single-purpose
# workflows (changelog-section.yml, commit-format.yml): push/PR to main,
# ubuntu-latest's preinstalled shellcheck rather than a third-party action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck -x scripts/*.sh .githooks/*
