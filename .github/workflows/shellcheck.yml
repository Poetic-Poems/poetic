name: Shellcheck

# Several scripts under scripts/ already carry `# shellcheck source=`/
# `# shellcheck disable=` directive comments, implying the author runs
# shellcheck locally or in-editor, but nothing enforced that for anyone else
# touching these scripts (issue #304). This job runs the same check in CI.
#
# Targets are discovered by shebang (`git grep -lE '^#!.*\b(ba)?sh\b' --
# scripts .githooks`) rather than a hand-maintained list, so a shell script
# added under either directory is covered the moment it is committed, even
# without a `.sh` suffix: `scripts/edit-poem` and `scripts/new-poem` are
# shell scripts by shebang alone, which an extension-based glob misses
# (issue #324). Discovery is by shebang rather than by extension for that
# reason, and it also keeps a non-shell file added under `.githooks/` from
# being handed to shellcheck. The step logs the set it discovered, so a
# script that escapes the pattern is visible in the job log rather than
# silently unlinted (issue #333), and refuses an empty set, which shellcheck
# would otherwise treat as "read stdin". `-x` follows local `source`d files
# (e.g. assemble-changelog.sh's `lib/changelog-grammar.sh`) so sourcing one
# script from another doesn't spuriously warn.
#
# Deliberately not a required status check (see AGENTS.md's "Branch
# protection in this repository" — the ruleset is an owner-only edit);
# landing this job non-required first lets the owner decide separately
# whether to require it. It does run on `merge_group` so that promoting it
# to a required check stays a one-line ruleset edit: a required context that
# never reports on a merge-group run wedges every queued pull request, which
# is how the retired `register` check had to be dropped from the ruleset
# (see .github/required-checks.txt, issues #256/#260). Unlike
# changelog-section.yml and commit-format.yml — which gate on
# `github.event_name == 'pull_request'` because they inspect the
# pull-request payload, and a merge group carries none — this job checks the
# code itself, so it runs on the merge group's merged result too, the same
# shape secret-scan.yml and codeql.yml use.
#
# Uses a pinned, checksum-verified shellcheck release binary rather than a
# third-party action (issue #326): a third-party *action* runs arbitrary
# code with access to the job, which this avoids, while pinning keeps the
# version the gate enforces a recorded property of this repository rather
# than of whatever ubuntu-latest happens to preinstall that week — a runner
# image bump must not turn this job red on a pull request that changed no
# shell script. Same pattern secret-scan.yml uses for gitleaks, except
# shellcheck's GitHub releases don't publish a checksums.txt asset, so the
# expected digest is hardcoded here instead of downloaded alongside the
# tarball.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLOf "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum -c
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" shellcheck
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run shellcheck
        run: |
          mapfile -t targets < <(git grep -lE '^#!.*\b(ba)?sh\b' -- scripts .githooks)
          printf 'Discovered %s shellcheck target(s):\n' "${#targets[@]}"
          printf '  %s\n' "${targets[@]}"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::Shebang discovery matched nothing under scripts/ or .githooks/." >&2
            exit 1
          fi
          shellcheck -x "${targets[@]}"
