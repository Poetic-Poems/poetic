name: Release

# Two independent triggers:
#
# - `push` to main that changes package.json (normally a "chore: release
#   vX.Y.Z" commit bumping the version field): tags the commit and publishes
#   the GitHub release, so the tag can never drift out of sync with the
#   version the commit itself is bumping to. package.json's version is the
#   single source of truth for this.
# - `pull_request` (and `merge_group`, for the same check on a merge queue's
#   candidate ref): guards against a version bump landing without a matching
#   CHANGELOG.md entry (see "Release process" in CLAUDE.md) by comparing the
#   version between the base and head commits and requiring a matching
#   `## [<version>]` heading when it changed.
#
# Each job is gated to its own event via `if:`, so a PR/merge-group run never
# tags/releases and a push run never re-does the changelog check.
#
# The `pull_request` trigger deliberately carries no `paths:` filter, for the
# same reason build-poems.yml's does not: `changelog-check` is meant to be
# usable as a required status check, and a trigger-level `paths:` filter would
# make it silently never report — stuck as "Expected" forever, blocking merge
# — on any PR that happens not to touch the filtered paths. See GitHub's
# "Choose when workflows run" guide:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
# The job runs on every PR instead and costs a few seconds: the version
# comparison below is a no-op unless package.json's version actually changed.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  pull_request:
  merge_group:

permissions:
  contents: write

jobs:
  changelog-check:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare package.json version between base and head
        id: version
        env:
          # merge_group carries no pull_request payload — its own base/head
          # shas play the same role.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          base_version=$(git show "${BASE_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          head_version=$(git show "${HEAD_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "base=${base_version}" >> "$GITHUB_OUTPUT"
          echo "head=${head_version}" >> "$GITHUB_OUTPUT"

      - name: Require a matching CHANGELOG entry when the version changed
        if: steps.version.outputs.base != steps.version.outputs.head
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          HEAD_VERSION: ${{ steps.version.outputs.head }}
        run: |
          set -euo pipefail
          heading="## [${HEAD_VERSION}]"
          if ! git show "${HEAD_SHA}:CHANGELOG.md" | grep -qF "$heading"; then
            echo "::error file=CHANGELOG.md::package.json bumped the version to ${HEAD_VERSION}, but CHANGELOG.md has no matching \"${heading}\" heading."
            exit 1
          fi

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag this commit
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Poetic ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Pack and upload release tarball
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball=$(npm pack)
          gh release upload "${{ steps.version.outputs.tag }}" "$tarball"
